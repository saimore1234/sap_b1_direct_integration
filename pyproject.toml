[project]
name = "sap_b1_direct_integration"
authors = [{ name = "Integration vendor", email = "support@example.invalid" }]
description = "Generic direct integration of SAP Business One with ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
india_compliance = ">=15.0.0,<16.0.0"
